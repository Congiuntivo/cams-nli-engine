[project]
name = "react-baseline"
version = "0.1.0"
description = "Generic ReAct-style tool-using agent baseline for CAMS study protocol generation."
requires-python = ">=3.10"
dependencies = [
    "nli-engine",
    "mcp>=1.0",
    "fastmcp>=2.8",
    "openai>=1.50",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[tool.uv.sources]
nli-engine = { path = "../../..", editable = true }

[project.scripts]
react-baseline-sweep = "react_baseline.sweep:main"
react-baseline-retrieval-mcp = "react_baseline.retrieval_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/react_baseline"]
