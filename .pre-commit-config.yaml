default_install_hook_types:
  - pre-commit
  - commit-msg
  - post-checkout
  - post-merge
  - post-rewrite
default_language_version:
  node: "20.18.0"
repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.5.16
    hooks:
      - id: uv-lock
      - id: uv-sync
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.0
    hooks:
      - id: ruff-check
        args: [--fix-only, --extend-select, I]
      - id: ruff-format
        entry: sh -c 'ruff format --force-exclude && git add -u'
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.3.3
    hooks:
      - id: prettier
        types_or: [markdown, json]
        exclude: ^dataset/prompts/
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.2.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: []
