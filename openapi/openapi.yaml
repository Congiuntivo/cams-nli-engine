        -
          $ref: '#/components/parameters/sessionId'
      requestBody:
        description: 'Random recurrent trigger payload.'
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RandomRecurrentTriggerRequest'
            example:
              triggerName: 'random_daily_prompts'
              minNumberOfTriggers: 3
              maxNumberOfTriggers: 8
              startTime:
                hour: 8
                minute: 0
              endTime:
                hour: 20
                minute: 0
      responses:
        '201':
          description: 'Random recurrent trigger added'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionMutationResponse'
        '400':
          description: 'Invalid request payload or duplicate trigger name'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        default:
          $ref: '#/components/responses/ServerError'
  /sessions/{sessionId}/triggers/recurrent-scheduled:
    post:
      summary: 'Add a recurrent scheduled trigger to the session protocol'
      operationId: 'addRecurrentScheduledTrigger'
      description: 'Adds a trigger that fires at a fixed clock time on a recurring schedule. triggerName must be unique within the protocol. type selects the recurrence (daily, weekly, monthly). For weekly recurrence dayOfWeek is required (1=Monday); for monthly recurrence dayOfMonth is required. time specifies the clock time with hour and minute fields. Returns 400 if triggerName is a duplicate.'
      tags:
        - 'Triggers'
      parameters:
        -
          $ref: '#/components/parameters/sessionId'
      requestBody:
        description: 'Recurrent scheduled trigger payload.'
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecurrentScheduledTriggerRequest'
            example:
              triggerName: 'weekday_checkin'
              type: 'weekly'
              time:
                hour: 9
                minute: 30
              dayOfWeek: 1
      responses:
        '201':
          description: 'Recurrent scheduled trigger added'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionMutationResponse'
        '400':
          description: 'Invalid request payload or duplicate trigger name'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        default:
          $ref: '#/components/responses/ServerError'
  /sessions/{sessionId}/triggers/scheduled:
    post:
      summary: 'Add a scheduled trigger to the session protocol'
      operationId: 'addScheduledTrigger'
      description: 'Adds a trigger with a time and a full recurrence rule based on RFC 5545 concepts. triggerName must be unique within the protocol. time specifies the clock time (hour, minute, optional second). recurrenceRule selects the frequency (daily, weekly, monthly, yearly), the interval, and the end condition (never, count, or elapsed time). Returns 400 if triggerName is a duplicate.'
      tags:
        - 'Triggers'
      parameters:
        -
          $ref: '#/components/parameters/sessionId'
      requestBody:
        description: 'Scheduled trigger payload.'
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduledTriggerRequest'
            example:
              triggerName: 'daily_checkin'
              time:
                hour: 9
                minute: 0
              recurrenceRule:
                frequency: 'daily'
                interval: 1
                end:
                  type: 'never'
      responses:
        '201':
          description: 'Scheduled trigger added'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionMutationResponse'
        '400':
          description: 'Invalid request payload or duplicate trigger name'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        default:
          $ref: '#/components/responses/ServerError'
  /sessions/{sessionId}/triggers/user-task:
    post:
      summary: 'Add a user-task trigger to the session protocol'
      operationId: 'addUserTaskTrigger'
      description: 'Adds a trigger that fires when a named user task reaches the specified state. triggerName must be unique within the protocol. taskName identifies the user task to watch; triggerCondition specifies the required state (e.g. done, expired, discarded). Returns 400 if triggerName is a duplicate.'
      tags:
        - 'Triggers'
      parameters:
        -
          $ref: '#/components/parameters/sessionId'
      requestBody:
        description: 'User-task trigger payload.'
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserTaskTriggerRequest'
            example:
              triggerName: 'survey_completion_trigger'
              taskName: 'daily_survey'
              triggerCondition: 'done'
      responses:
        '201':
          description: 'User-task trigger added'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionMutationResponse'
        '400':
          description: 'Invalid request payload or duplicate trigger name'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        default:
          $ref: '#/components/responses/ServerError'
  /sessions/{sessionId}/triggers/sampling-event:
    post:
      summary: 'Add a sampling-event trigger to the session protocol'
      operationId: 'addSamplingEventTrigger'
      description: 'Adds a trigger that fires when data of a specific measure type is sampled and optionally matches a condition. triggerName must be unique within the protocol. measureType is the CARP data type URI whose measurements are evaluated. triggerCondition is an optional serialized CARP Data object (including __type); when provided, only measurements matching its fields fire the trigger. Returns 400 if triggerName is a duplicate.'
      tags:
        - 'Triggers'
      parameters:
        -
          $ref: '#/components/parameters/sessionId'
      requestBody:
        description: 'Sampling-event trigger payload. triggerCondition is optional and should follow serialized CARP Data format.'
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SamplingEventTriggerRequest'
            example:
              triggerName: 'after_completed_task'
              measureType: 'dk.cachet.carp.completed_task'
              triggerCondition:
                __type: 'dk.cachet.carp.common.application.data.completedtask'
      responses:
        '201':
          description: 'Sampling-event trigger added'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionMutationResponse'
        '400':
          description: 'Invalid request payload or duplicate trigger name'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        default:
          $ref: '#/components/responses/ServerError'
components:
  parameters:
    sessionId:
      name: 'sessionId'
      in: 'path'
      required: true
      description: 'Session identifier returned by POST /sessions.'
      schema:
        type: 'string'
        example: 'session_1234567890_1'
  responses:
    SessionNotFound:
      description: 'Session id not found.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: 'Unexpected server error.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    CreateSessionResponse:
      type: 'object'
      required:
        - 'sessionId'
      properties:
        sessionId:
          type: 'string'
          pattern: '^session_\d+_\d+$'
          example: 'session_1234567890_1'
    CreateProtocolRequest:
      type: 'object'
      required:
        - 'name'
      properties:
        name:
          type: 'string'
          example: 'My Study Protocol'
        ownerId:
          type: 'string'
          format: 'uuid'
          example: '979b408d-784e-4b1b-bb1e-ff9204e072f3'
        protocolVersionTag:
          type: 'string'
          example: 'v1.0.0'
        applicationName:
          type: 'string'
          example: 'carp_study_app'
        privacySchemaName:
          type: 'string'
          enum:
            - 'default-privacy-schema'
          example: 'default-privacy-schema'
    SessionMutationResponse:
      type: 'object'
      required:
        - 'sessionId'
        - 'unfulfilledRequirements'
      properties:
        sessionId:
          type: 'string'
        unfulfilledRequirements:
          type: 'object'
          additionalProperties: true
    RequirementsResponse:
      type: 'object'
      required:
        - 'unfulfilledRequirements'
      properties:
        unfulfilledRequirements:
          type: 'object'
          additionalProperties: true
    NamedDevice:
      type: 'object'
      required:
        - 'name'
        - 'device'
      properties:
        name:
          type: 'string'
        device:
          type: 'object'
          additionalProperties: true
    DurationRequest:
      type: 'object'
      properties:
        days:
          type: 'integer'
          minimum: 0
        hours:
          type: 'integer'
          minimum: 0
        minutes:
          type: 'integer'
          minimum: 0
        seconds:
          type: 'integer'
          minimum: 0
        milliseconds:
          type: 'integer'
          minimum: 0
        microseconds:
          type: 'integer'
          minimum: 0
    SerializeResponse:
      type: 'object'
      required:
        - 'name'
        - 'ownerId'
        - 'version'
      properties:
        name:
          type: 'string'
          example: 'My Study Protocol'
        ownerId:
          type: 'string'
          example: '979b408d-784e-4b1b-bb1e-ff9204e072f3'
        version:
          type: 'integer'
          example: 0
        id:
          type: 'string'
        createdOn:
          type: 'string'
          format: 'date-time'
        description:
          type: 'string'
        participantRoles:
          type: 'array'
          items:
            type: 'object'
        primaryDevices:
          type: 'array'
          items:
            type: 'object'
        connectedDevices:
          type: 'array'
          items:
            type: 'object'
        tasks:
          type: 'array'
          items:
            type: 'object'
        triggers:
          type: 'array'
          items:
            type: 'object'
        taskControls:
          type: 'array'
          items:
            type: 'object'
    SetApplicationDataRequest:
      type: 'object'
      properties:
        applicationData:
          type: 'object'
          additionalProperties: true
    ErrorResponse:
      type: 'object'
      required:
        - 'error'
      properties:
        error:
          type: 'string'
    DataEndpointRequest:
      type: 'object'
      required:
        - 'endpointType'
      properties:
        endpointType:
          type: 'string'
          enum:
            - 'CAWS'
            - 'SQLITE'
            - 'FILE'
          example: 'CAWS'
        uploadMethod:
          type: 'string'
          enum:
            - 'stream'
            - 'datapoint'
            - 'file'
          example: 'stream'
        name:
          type: 'string'
          example: 'CARP Web Services'
        deleteWhenUploaded:
          type: 'boolean'
          example: true
        bufferSize:
          type: 'integer'
          example: 500000
        zip:
          type: 'boolean'
          example: true
        encrypt:
          type: 'boolean'
          example: false
        publicKey:
          type: 'string'
          example: '-----BEGIN PUBLIC KEY-----...-----END PUBLIC KEY-----'
    PrimaryDevicesResponse:
      type: 'object'
      required:
        - 'primaryDevices'
      properties:
        primaryDevices:
          type: 'array'
          items:
            $ref: '#/components/schemas/NamedDevice'
    PrimaryDeviceRoleRequest:
      type: 'object'
      properties:
        roleName:
          type: 'string'
          example: 'User Phone'
    AddParticipantRoleRequest:
      type: 'object'
      required:
        - 'roleName'
      properties:
        roleName:
          type: 'string'
          example: 'Patient'
        isOptional:
          type: 'boolean'
    ParticipantRolesResponse:
      type: 'object'
      required:
        - 'roleNames'
      properties:
        roleNames:
          type: 'array'
          items:
            type: 'string'
    ParticipantDataType:
      type: 'string'
      enum:
        - 'sex'
        - 'phone_number'
        - 'ssn'
        - 'full_name'
        - 'informed_consent'
        - 'address'
        - 'diagnosis'
        - 'note'
        - 'educational_degree'
        - 'onboarding_researcher'
        - 'language'
        - 'occupation'
    AddExpectedParticipantDataForRoleRequest:
      type: 'object'
      required:
        - 'roleName'
        - 'dataType'
      properties:
        roleName:
          type: 'string'
          example: 'Patient'
        dataType:
          $ref: '#/components/schemas/ParticipantDataType'
    AddExpectedParticipantDataRequest:
      type: 'object'
      required:
        - 'dataType'
      properties:
        dataType:
          $ref: '#/components/schemas/ParticipantDataType'
    ServiceRolesResponse:
      type: 'object'
      required:
        - 'services'
      properties:
        services:
          type: 'array'
          items:
            $ref: '#/components/schemas/NamedDevice'
    WeatherServiceRequest:
      allOf:
        -
          $ref: '#/components/schemas/BaseConnectedDeviceRequest'
    AirQualityServiceRequest:
      allOf:
        -
          $ref: '#/components/schemas/BaseConnectedDeviceRequest'
    HealthServiceRequest:
      allOf:
        -
          $ref: '#/components/schemas/BaseConnectedDeviceRequest'
    LocationServiceRequest:
      allOf:
        -
          $ref: '#/components/schemas/BaseConnectedDeviceRequest'
        -
          type: 'object'
          properties:
            accuracy:
              type: 'string'
              enum:
                - 'powerSave'
                - 'low'
                - 'balanced'
                - 'high'
                - 'navigation'
                - 'reduced'
            distance:
              type: 'number'
            interval:
              $ref: '#/components/schemas/DurationRequest'
            notificationTitle:
              type: 'string'
            notificationMessage:
              type: 'string'
            notificationDescription:
              type: 'string'
            notificationIconName:
              type: 'string'
            notificationOnTapBringToFront:
              type: 'boolean'
    DeviceRolesResponse:
      type: 'object'
      required:
        - 'devices'
      properties:
        devices:
          type: 'array'
          items:
            $ref: '#/components/schemas/NamedDevice'
    BaseConnectedDeviceRequest:
      type: 'object'
      required:
        - 'primaryDeviceRoleName'
      properties:
        roleName:
          type: 'string'
        primaryDeviceRoleName:
          type: 'string'
          example: 'User Phone'
    ESenseDeviceRequest:
      allOf:
        -
          $ref: '#/components/schemas/BaseConnectedDeviceRequest'
        -
          type: 'object'
          properties:
            isOptional:
              type: 'boolean'
            samplingRate:
              type: 'integer'
    MovesenseDeviceRequest:
      allOf:
        -
          $ref: '#/components/schemas/BaseConnectedDeviceRequest'
        -
          type: 'object'
          properties:
            isOptional:
              type: 'boolean'
    MovisensDeviceRequest:
      allOf:
        -
          $ref: '#/components/schemas/BaseConnectedDeviceRequest'
        -
          type: 'object'
          properties:
            sensorLocation:
              type: 'string'
              enum:
                - 'RightSideHip'
                - 'Chest'
                - 'RightWrist'
                - 'LeftWrist'
                - 'LeftAnkle'
                - 'RightAnkle'
                - 'RightThigh'
                - 'LeftThigh'
                - 'RightUpperArm'
                - 'LeftUpperArm'
                - 'LeftSideHip'
            sex:
              type: 'string'
              enum:
                - 'Male'
                - 'Female'
                - 'Intersex'
            height:
              type: 'integer'
            weight:
              type: 'integer'
            age:
              type: 'integer'
    PolarDeviceRequest:
      allOf:
        -
          $ref: '#/components/schemas/BaseConnectedDeviceRequest'
        -
          type: 'object'
          properties:
            isOptional:
              type: 'boolean'
            namePrefix:
              type: 'string'
    TaskSummary:
      type: 'object'
      required:
        - 'name'
        - 'serializedObj'
      properties:
        name:
          type: 'string'
          example: 'daily_survey'
        serializedObj:
          type: 'object'
          additionalProperties: true
    TasksResponse:
      type: 'object'
      required:
        - 'tasks'
      properties:
        tasks:
          type: 'array'
          items:
            $ref: '#/components/schemas/TaskSummary'
    TaskSamplingConfigurationRequest:
      type: 'object'
      required:
        - 'samplingType'
      properties:
        samplingType:
          type: 'string'
          enum:
            - 'none'
            - 'interval'
            - 'periodic'
            - 'location'
            - 'mobility'
            - 'health'
        interval:
          $ref: '#/components/schemas/DurationRequest'
        duration:
          $ref: '#/components/schemas/DurationRequest'
        once:
          type: 'boolean'
          example: false
        usePriorContexts:
          type: 'boolean'
          example: true
        stopRadius:
          type: 'number'
          example: 25
        placeRadius:
          type: 'number'
          example: 50
        stopDuration:
          $ref: '#/components/schemas/DurationRequest'
        healthDataTypes:
          type: 'array'
          items:
            type: 'string'
        days:
          type: 'integer'
          example: 30
    TaskMeasureRequest:
      type: 'object'
      required:
        - 'measureType'
      properties:
        measureType:
          type: 'string'
          enum:
            - 'dk.cachet.carp.acceleration'
            - 'dk.cachet.carp.accelerationfeatures'
            - 'dk.cachet.carp.activity'
            - 'dk.cachet.carp.airquality'
            - 'dk.cachet.carp.ambientlight'
            - 'dk.cachet.carp.apps'
            - 'dk.cachet.carp.appusage'
            - 'dk.cachet.carp.audio'
            - 'dk.cachet.carp.batterystate'
            - 'dk.cachet.carp.beacon'
            - 'dk.cachet.carp.bluetooth'
            - 'dk.cachet.carp.calendar'
            - 'dk.cachet.carp.connectivity'
            - 'dk.cachet.carp.deviceinformation'
            - 'dk.cachet.carp.esense.button'
            - 'dk.cachet.carp.esense.sensor'
            - 'dk.cachet.carp.freememory'
            - 'dk.cachet.carp.geofence'
            - 'dk.cachet.carp.health'
            - 'dk.cachet.carp.image'
            - 'dk.cachet.carp.location'
            - 'dk.cachet.carp.magneticfield'
            - 'dk.cachet.carp.mobility'
            - 'dk.cachet.carp.movesense.deviceinformation'
            - 'dk.cachet.carp.movesense.ecg'
            - 'dk.cachet.carp.movesense.hr'
            - 'dk.cachet.carp.movesense.imu'
            - 'dk.cachet.carp.movesense.state'
            - 'dk.cachet.carp.movesense.temperature'
            - 'dk.cachet.carp.movisens.activity'
            - 'dk.cachet.carp.movisens.eda'
            - 'dk.cachet.carp.movisens.hr'
            - 'dk.cachet.carp.movisens.respiration'
            - 'dk.cachet.carp.movisens.skin_temperature'
            - 'dk.cachet.carp.movisens.tap_marker'
            - 'dk.cachet.carp.noise'
            - 'dk.cachet.carp.nongravitationalacceleration'
            - 'dk.cachet.carp.phonelog'
            - 'dk.cachet.carp.polar.accelerometer'
            - 'dk.cachet.carp.polar.ecg'
            - 'dk.cachet.carp.polar.gyroscope'
            - 'dk.cachet.carp.polar.hr'
            - 'dk.cachet.carp.polar.magnetometer'
            - 'dk.cachet.carp.polar.ppg'
            - 'dk.cachet.carp.polar.ppi'
            - 'dk.cachet.carp.rotation'
            - 'dk.cachet.carp.screenevent'
            - 'dk.cachet.carp.stepevent'
            - 'dk.cachet.carp.textmessage'
            - 'dk.cachet.carp.textmessagelog'
            - 'dk.cachet.carp.timezone'
            - 'dk.cachet.carp.video'
            - 'dk.cachet.carp.weather'
            - 'dk.cachet.carp.wifi'
