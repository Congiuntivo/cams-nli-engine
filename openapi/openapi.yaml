openapi: '3.0.3'
info:
  title: 'Study Protocol Authoring API'
  version: '0.4.0'
  description: 'Stateful API exposing session-scoped protocol state and serialization endpoints.'
servers:
  -
    url: 'http://localhost:8080'
paths:
  /sessions/{sessionId}/requirements:
    get:
      summary: 'Get current unfulfilled requirements for the session'
      operationId: 'getRequirements'
      description: 'Returns the current unfulfilled requirements for the session.'
      tags:
        - 'Requirements and Serialization'
      parameters:
        -
          name: 'sessionId'
          in: 'path'
          required: true
          description: 'Session id returned by POST /protocol/new.'
          schema:
            type: 'string'
            example: 'session_1234567890_1'
      responses:
        200:
          description: 'Current unfulfilled requirements for the session'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementsResponse'
        400:
          description: 'Missing session id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: 'Session id not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /protocol/new:
    post:
      summary: 'Create a new protocol authoring session'
      operationId: 'createProtocolSession'
      description: 'Creates an in-memory authoring session and returns a sessionId for subsequent requests.'
      tags:
        - 'Sessions'
      requestBody:
        description: 'Protocol creation payload.'
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProtocolRequest'
            example:
              name: 'My Study Protocol'
              ownerId: '979b408d-784e-4b1b-bb1e-ff9204e072f3'
              protocolVersionTag: 'v1.0.0'
              protocolApiLevel: '2.0'
              applicationName: 'carp_study_app'
              privacySchemaName: 'default-privacy-schema'
      responses:
        201:
          description: 'New authoring session created'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSessionResponse'
  /sessions/{sessionId}/serialize:
    get:
      summary: 'Return the serialized protocol for the session'
      operationId: 'serializeProtocol'
      description: 'Returns the serialized protocol for the session.'
      tags:
        - 'Requirements and Serialization'
      parameters:
        -
          name: 'sessionId'
          in: 'path'
          required: true
          description: 'Session id returned by POST /protocol/new.'
          schema:
            type: 'string'
            example: 'session_1234567890_1'
      responses:
        200:
          description: 'Serialized protocol for the session'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SerializeResponse'
        400:
          description: 'Missing session id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        409:
          description: 'Protocol cannot be serialized until critical requirements are fulfilled'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: 'Session id not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /sessions/{sessionId}/data-endpoint:
    post:
      summary: 'Add a data endpoint to a protocol in the session'
      operationId: 'addDataEndpoint'
      description: 'Adds a data endpoint to the session protocol. Protocol must already be started with POST /protocol/new.'
      tags:
        - 'Data Endpoint'
      parameters:
        -
          name: 'sessionId'
          in: 'path'
          required: true
          description: 'Session id returned by POST /protocol/new.'
          schema:
            type: 'string'
            example: 'session_1234567890_1'
      requestBody:
        description: 'Data endpoint configuration payload.'
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataEndpointRequest'
            example:
              endpointType: 'CAWS'
              uploadMethod: 'stream'
              name: 'CARP Web Services'
              deleteWhenUploaded: true
      responses:
        200:
          description: 'Data endpoint added'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEndpointResponse'
        400:
          description: 'Missing or invalid query parameters'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: 'Session id not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /sessions/{sessionId}/primary-devices:
    get:
      summary: 'Get primary devices from the session protocol'
      operationId: 'getPrimaryDevices'
      description: 'Returns primary devices currently configured in the session protocol, including role name and serialized device payload.'
      tags:
        - 'Primary Devices'
      parameters:
        -
          name: 'sessionId'
          in: 'path'
          required: true
          description: 'Session id returned by POST /protocol/new.'
          schema:
            type: 'string'
            example: 'session_1234567890_1'
      responses:
        200:
          description: 'Primary devices returned'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrimaryDevicesResponse'
        400:
          description: 'Missing session id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: 'Session id not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /sessions/{sessionId}/primary-devices/smartphone:
    post:
      summary: 'Add a smartphone primary device to the session protocol'
      operationId: 'addSmartphonePrimaryDevice'
      description: 'Adds a smartphone as a primary device in the session protocol.'
      tags:
        - 'Primary Devices'
      parameters:
        -
          name: 'sessionId'
          in: 'path'
          required: true
          description: 'Session id returned by POST /protocol/new.'
          schema:
            type: 'string'
            example: 'session_1234567890_1'
      requestBody:
        description: 'Optional role name for the primary smartphone.'
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrimaryDeviceRoleRequest'
            example:
              roleName: 'User Phone'
      responses:
        200:
          description: 'Primary device added'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementsResponse'
        400:
          description: 'Missing session id, invalid payload, or incompatible protocol type'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: 'Session id not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /sessions/{sessionId}/primary-devices/web-browser:
    post:
      summary: 'Add a web browser primary device to the session protocol'
      operationId: 'addWebBrowserPrimaryDevice'
      description: 'Adds a web browser as a primary device in the session protocol.'
