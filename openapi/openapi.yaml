          $ref: '#/components/schemas/TaskSamplingConfigurationRequest'
    BackgroundTaskRequest:
      type: 'object'
      required:
        - 'name'
        - 'description'
        - 'measures'
      properties:
        name:
          type: 'string'
          example: 'daily_context_collection'
        description:
          type: 'string'
          example: 'Collect context snapshots during the day.'
        measures:
          type: 'array'
          items:
            $ref: '#/components/schemas/TaskMeasureRequest'
