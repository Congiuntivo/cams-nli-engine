              triggerName: 'weekday_checkin'
              type: 'weekly'
              time:
                hour: 9
                minute: 30
              dayOfWeek: 1
      responses:
        200:
          description: 'Recurrent scheduled trigger added'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionMutationResponse'
        400:
          description: 'Invalid request payload or duplicate trigger name'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: 'Session id not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /sessions/{sessionId}/triggers/scheduled:
    post:
      summary: 'Add a scheduled trigger to the session protocol'
      operationId: 'addScheduledTrigger'
      description: 'Adds a scheduled trigger with a recurrence rule based on RFC-5545 concepts.'
      tags:
        - 'Triggers'
      parameters:
        -
          name: 'sessionId'
          in: 'path'
          required: true
          description: 'Session id returned by POST /protocol/new.'
          schema:
            type: 'string'
            example: 'session_1234567890_1'
      requestBody:
        description: 'Scheduled trigger payload.'
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduledTriggerRequest'
            example:
              triggerName: 'daily_checkin'
              time:
                hour: 9
                minute: 0
              recurrenceRule:
                frequency: 'daily'
                interval: 1
                end:
                  type: 'never'
      responses:
        200:
          description: 'Scheduled trigger added'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionMutationResponse'
        400:
          description: 'Invalid request payload or duplicate trigger name'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: 'Session id not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /sessions/{sessionId}/triggers/user-task:
    post:
      summary: 'Add a user-task trigger to the session protocol'
      operationId: 'addUserTaskTrigger'
      description: 'Adds a trigger that fires when a named user task reaches the specified state.'
      tags:
        - 'Triggers'
      parameters:
        -
          name: 'sessionId'
          in: 'path'
          required: true
          description: 'Session id returned by POST /protocol/new.'
          schema:
            type: 'string'
            example: 'session_1234567890_1'
      requestBody:
        description: 'User-task trigger payload.'
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserTaskTriggerRequest'
            example:
              triggerName: 'survey_completion_trigger'
              taskName: 'daily_survey'
              triggerCondition: 'done'
      responses:
        200:
          description: 'User-task trigger added'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionMutationResponse'
        400:
          description: 'Invalid request payload or duplicate trigger name'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: 'Session id not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /sessions/{sessionId}/triggers/sampling-event:
    post:
      summary: 'Add a sampling-event trigger to the session protocol'
      operationId: 'addSamplingEventTrigger'
      description: 'Adds a trigger that fires when data of a specific measure type is sampled. Optional triggerCondition must be a serialized CARP Data object containing a __type field and any matching data fields.'
      tags:
        - 'Triggers'
      parameters:
        -
          name: 'sessionId'
          in: 'path'
          required: true
          description: 'Session id returned by POST /protocol/new.'
          schema:
            type: 'string'
            example: 'session_1234567890_1'
      requestBody:
        description: 'Sampling-event trigger payload. triggerCondition is optional and should follow serialized CARP Data format.'
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SamplingEventTriggerRequest'
            example:
              triggerName: 'after_completed_task'
              measureType: 'dk.cachet.carp.completed_task'
              triggerCondition:
                __type: 'dk.cachet.carp.common.application.data.completedtask'
      responses:
        200:
          description: 'Sampling-event trigger added'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionMutationResponse'
        400:
          description: 'Invalid request payload or duplicate trigger name'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: 'Session id not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    CreateSessionResponse:
      type: 'object'
      required:
        - 'sessionId'
      properties:
        sessionId:
          type: 'string'
    CreateProtocolRequest:
      type: 'object'
      required:
        - 'name'
      properties:
        name:
          type: 'string'
          example: 'My Study Protocol'
        ownerId:
          type: 'string'
          example: '979b408d-784e-4b1b-bb1e-ff9204e072f3'
        protocolVersionTag:
          type: 'string'
          example: 'v1.0.0'
        protocolApiLevel:
          type: 'string'
          example: '2.0'
        applicationName:
          type: 'string'
          example: 'carp_study_app'
        privacySchemaName:
          type: 'string'
          enum:
            - 'default-privacy-schema'
          example: 'default-privacy-schema'
    SessionMutationResponse:
      type: 'object'
      required:
        - 'sessionId'
        - 'unfulfilledRequirements'
      properties:
        sessionId:
          type: 'string'
        unfulfilledRequirements:
          type: 'object'
    RequirementsResponse:
      type: 'object'
      required:
        - 'unfulfilledRequirements'
      properties:
        unfulfilledRequirements:
          type: 'object'
    NamedDevice:
      type: 'object'
      required:
        - 'name'
        - 'device'
      properties:
        name:
          type: 'string'
        device:
          type: 'object'
    DurationRequest:
      type: 'object'
      properties:
        days:
          type: 'integer'
        hours:
          type: 'integer'
        minutes:
          type: 'integer'
        seconds:
          type: 'integer'
        milliseconds:
          type: 'integer'
        microseconds:
          type: 'integer'
    SerializeResponse:
      type: 'object'
      required:
        - 'name'
        - 'ownerId'
        - 'version'
      properties:
        name:
          type: 'string'
          example: 'My Study Protocol'
        ownerId:
          type: 'string'
          example: '979b408d-784e-4b1b-bb1e-ff9204e072f3'
        version:
          type: 'integer'
          example: 0
        id:
          type: 'string'
        createdOn:
          type: 'string'
        description:
          type: 'string'
        participantRoles:
          type: 'array'
          items:
            type: 'object'
        primaryDevices:
          type: 'array'
          items:
            type: 'object'
        connectedDevices:
          type: 'array'
          items:
            type: 'object'
        tasks:
          type: 'array'
          items:
            type: 'object'
        triggers:
          type: 'array'
          items:
            type: 'object'
        taskControls:
          type: 'array'
          items:
            type: 'object'
    ErrorResponse:
      type: 'object'
      required:
        - 'error'
      properties:
        error:
          type: 'string'
    DataEndpointResponse:
      type: 'object'
      required:
        - 'sessionId'
        - 'unfulfilledRequirements'
      properties:
        sessionId:
          type: 'string'
        unfulfilledRequirements:
          type: 'object'
    DataEndpointRequest:
      type: 'object'
      required:
        - 'endpointType'
      properties:
        endpointType:
          type: 'string'
          enum:
            - 'CAWS'
            - 'SQLITE'
            - 'FILE'
          example: 'CAWS'
        uploadMethod:
          type: 'string'
          enum:
            - 'stream'
            - 'datapoint'
            - 'file'
          example: 'stream'
        name:
          type: 'string'
          example: 'CARP Web Services'
        deleteWhenUploaded:
          type: 'boolean'
          example: true
        bufferSize:
          type: 'integer'
          example: 500000
        zip:
          type: 'boolean'
          example: true
        encrypt:
          type: 'boolean'
          example: false
        publicKey:
          type: 'string'
