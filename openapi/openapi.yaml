    TimeOfDayRequest:
      type: 'object'
      required:
        - 'hour'
        - 'minute'
      properties:
        hour:
          type: 'integer'
          example: 8
        minute:
          type: 'integer'
          example: 30
        second:
          type: 'integer'
          example: 0
    RandomRecurrentTriggerRequest:
      type: 'object'
      required:
        - 'triggerName'
        - 'minNumberOfTriggers'
        - 'maxNumberOfTriggers'
        - 'startTime'
        - 'endTime'
      properties:
        triggerName:
          type: 'string'
          example: 'random_daily_prompts'
        minNumberOfTriggers:
          type: 'integer'
          example: 3
        maxNumberOfTriggers:
          type: 'integer'
          example: 8
        startTime:
          $ref: '#/components/schemas/TimeOfDayRequest'
        endTime:
          $ref: '#/components/schemas/TimeOfDayRequest'
    RecurrentScheduledTriggerRequest:
      type: 'object'
      required:
        - 'triggerName'
        - 'type'
        - 'time'
      properties:
        triggerName:
          type: 'string'
          example: 'weekday_checkin'
        type:
          type: 'string'
          enum:
            - 'daily'
            - 'weekly'
            - 'monthly'
          example: 'weekly'
        time:
          $ref: '#/components/schemas/TimeOfDayRequest'
        end:
          type: 'string'
          example: '2026-12-31T23:59:59Z'
        separationCount:
          type: 'integer'
          example: 1
        maxNumberOfSampling:
          type: 'integer'
          example: 10
        dayOfWeek:
          type: 'integer'
          example: 1
        weekOfMonth:
          type: 'integer'
          example: 2
        dayOfMonth:
          type: 'integer'
          example: 15
        duration:
          $ref: '#/components/schemas/DurationRequest'
    RecurrenceEndRequest:
      type: 'object'
      required:
        - 'type'
      properties:
        type:
          type: 'string'
          enum:
            - 'until'
            - 'count'
            - 'never'
          example: 'never'
        elapsedTime:
          $ref: '#/components/schemas/DurationRequest'
        count:
          type: 'integer'
          example: 10
    RecurrenceRuleRequest:
      type: 'object'
      required:
        - 'frequency'
      properties:
        frequency:
          type: 'string'
          enum:
            - 'secondly'
            - 'minutely'
            - 'hourly'
            - 'daily'
            - 'weekly'
            - 'monthly'
            - 'yearly'
          example: 'daily'
        interval:
          type: 'integer'
          example: 1
        end:
          $ref: '#/components/schemas/RecurrenceEndRequest'
    ScheduledTriggerRequest:
      type: 'object'
      required:
        - 'triggerName'
        - 'time'
        - 'recurrenceRule'
      properties:
        triggerName:
          type: 'string'
          example: 'daily_checkin'
        time:
          $ref: '#/components/schemas/TimeOfDayRequest'
        recurrenceRule:
          $ref: '#/components/schemas/RecurrenceRuleRequest'
    UserTaskTriggerRequest:
      type: 'object'
      required:
        - 'triggerName'
        - 'taskName'
        - 'triggerCondition'
      properties:
        triggerName:
          type: 'string'
          example: 'survey_completion_trigger'
        taskName:
          type: 'string'
          example: 'daily_survey'
        triggerCondition:
          type: 'string'
          enum:
            - 'initialized'
            - 'enqueued'
            - 'dequeued'
            - 'notified'
            - 'started'
            - 'canceled'
            - 'done'
            - 'expired'
            - 'undefined'
          example: 'done'
    SamplingEventTriggerRequest:
      type: 'object'
      required:
        - 'triggerName'
        - 'measureType'
      properties:
        triggerName:
          type: 'string'
          example: 'after_completed_task'
        measureType:
          type: 'string'
          example: 'dk.cachet.carp.completed_task'
        triggerCondition:
          $ref: '#/components/schemas/SerializedCarpDataRequest'
    SerializedCarpDataRequest:
      type: 'object'
      required:
        - '__type'
      properties:
        __type:
          type: 'string'
          example: 'dk.cachet.carp.common.application.data.completedtask'