openapi: '3.0.3'
info:
  title: 'Study Protocol Authoring API'
  version: '0.4.0'
  description: |
    A local HTTP server for interactively authoring CARP SmartphoneStudyProtocol objects. State is in-memory and lost on restart. The server binds to http://localhost:8080 and is intended for local use only.

    ## Session lifecycle

    Every session starts with POST /sessions, which returns a sessionId used in all subsequent calls:

      POST /sessions                                          create session, get sessionId
      POST /sessions/{id}/primary-devices/...               required before tasks and triggers
      POST /sessions/{id}/devices/...                       optional connected devices
      POST /sessions/{id}/participant-roles                 define participant roles
      POST /sessions/{id}/participant-roles/expected-data   expected data for a specific role
      POST /sessions/{id}/expected-data                     expected data for all roles
      POST /sessions/{id}/services/...                      optional background services
      POST /sessions/{id}/tasks/...                         define tasks
      POST /sessions/{id}/triggers/...                      define triggers
      POST /sessions/{id}/task-controls                     bind triggers to tasks and devices
      POST /sessions/{id}/data-endpoint                     configure upload endpoint
      GET  /sessions/{id}/requirements                      inspect open requirements
      GET  /sessions/{id}/serialize                         finalize protocol

    ## Requirements system

    Every mutation response includes an unfulfilledRequirements map with warning and critical items. GET /sessions/{id}/serialize returns 409 if any critical requirements remain unmet. Use GET /sessions/{id}/requirements to inspect the current state at any time without mutating the session.

    ## Polymorphic payloads

    Task, trigger, and device payloads are polymorphic CARP types. The __type field in each serialized object selects the concrete class. Responses that include these objects (e.g. getTasks, getTriggers, getDeviceRoles) always include __type in the returned payload.
servers:
  -
    url: 'http://localhost:8080'
tags:
  -
    name: 'Sessions'
    description: 'Create and inspect authoring sessions.'
  -
    name: 'Primary Devices'
    description: 'Configure the primary device for the protocol.'
  -
    name: 'Devices'
    description: 'Add connected peripheral devices to the protocol.'
  -
    name: 'Services'
    description: 'Add background data-collection services.'
  -
    name: 'Participant Roles'
    description: 'Define participant roles in the study.'
  -
    name: 'Expected Participant Data'
    description: 'Declare what data is expected from each participant role.'
  -
    name: 'Tasks'
    description: 'Add tasks that participants will perform.'
  -
    name: 'Triggers'
    description: 'Define triggers that schedule or activate tasks.'
  -
    name: 'Task Controls'
    description: 'Bind triggers to tasks and target device roles.'
  -
    name: 'Data Endpoint'
    description: 'Configure the data upload endpoint for the protocol.'
  -
    name: 'Requirements and Serialization'
    description: 'Inspect unfulfilled requirements and finalize the protocol.'
paths:
  /sessions/{sessionId}/requirements:
    get:
      summary: 'Get current unfulfilled requirements for the session'
      operationId: 'getRequirements'
      description: 'Returns the current unfulfilled requirements for the session. Each requirement has a name and a severity — critical requirements block serialization; warnings do not. Call this endpoint at any point to check what still needs to be configured before GET /sessions/{id}/serialize will succeed.'
      tags:
        - 'Requirements and Serialization'
      parameters:
        -
          $ref: '#/components/parameters/sessionId'
      responses:
        '200':
          description: 'Current unfulfilled requirements for the session'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementsResponse'
        '400':
          description: 'Missing session id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        default:
          $ref: '#/components/responses/ServerError'
  /sessions:
    post:
      summary: 'Create a new protocol authoring session'
      operationId: 'createProtocolSession'
      description: 'Creates an in-memory authoring session and returns a sessionId for all subsequent requests. Sessions are not persisted — restarting the server destroys all sessions. name is required; all other fields are optional and customize the resulting protocol metadata. The sessionId returned here must be included in the path of every subsequent call.'
      tags:
        - 'Sessions'
      requestBody:
        description: 'Protocol creation payload.'
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProtocolRequest'
            example:
              name: 'My Study Protocol'
              ownerId: '979b408d-784e-4b1b-bb1e-ff9204e072f3'
              protocolVersionTag: 'v1.0.0'
              applicationName: 'carp_study_app'
              privacySchemaName: 'default-privacy-schema'
      responses:
        '201':
          description: 'New authoring session created'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSessionResponse'
        default:
          $ref: '#/components/responses/ServerError'
  /sessions/{sessionId}/application-data:
    put:
      summary: 'Set custom application data on the protocol'
      operationId: 'setApplicationData'
      tags:
        - 'Sessions'
      parameters:
        -
          $ref: '#/components/parameters/sessionId'
      requestBody:
        description: 'Free-form key/value map to store as custom application data.'
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetApplicationDataRequest'
            example:
              myKey: 'myValue'
      responses:
        '200':
          description: 'Application data updated'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionMutationResponse'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        default:
          $ref: '#/components/responses/ServerError'
  /sessions/{sessionId}/serialize:
    get:
      summary: 'Return the serialized protocol for the session'
      operationId: 'serializeProtocol'
      description: 'Finalizes the session and returns the full serialized CARP SmartphoneStudyProtocol as JSON. Returns 409 if any critical requirements remain unmet — use GET /sessions/{id}/requirements to check first. The response contains the full protocol graph including all devices, tasks, triggers, and task controls. Calling serialize does not destroy the session; further mutations are still possible afterward.'
      tags:
        - 'Requirements and Serialization'
      parameters:
        -
          $ref: '#/components/parameters/sessionId'
      responses:
        '200':
          description: 'Serialized protocol for the session'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SerializeResponse'
        '400':
          description: 'Missing session id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 'Protocol cannot be serialized until critical requirements are fulfilled'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        default:
          $ref: '#/components/responses/ServerError'
  /sessions/{sessionId}/data-endpoint:
    put:
      summary: 'Add a data endpoint to a protocol in the session'
      operationId: 'addDataEndpoint'
      description: 'Configures the data upload endpoint for the protocol. endpointType must be one of CAWS, SQLITE, or FILE. For CAWS and SQLITE endpoints, uploadMethod controls how data is batched: stream, datapoint, or file. For FILE endpoints, setting encrypt to true requires publicKey to also be provided. bufferSize controls the in-memory data buffer size in bytes and must be greater than 0 if specified.'
      tags:
        - 'Data Endpoint'
      parameters:
        -
          $ref: '#/components/parameters/sessionId'
      requestBody:
        description: 'Data endpoint configuration payload.'
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataEndpointRequest'
            example:
              endpointType: 'CAWS'
              uploadMethod: 'stream'
              name: 'CARP Web Services'
              deleteWhenUploaded: true
      responses:
        '201':
          description: 'Data endpoint added'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionMutationResponse'
        '400':
          description: 'Invalid or missing fields in the request body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        default:
          $ref: '#/components/responses/ServerError'
  /sessions/{sessionId}/primary-devices:
    get:
      summary: 'Get primary devices from the session protocol'
      operationId: 'getPrimaryDevices'
      description: 'Returns primary devices currently configured in the session protocol, including role name and serialized device payload. Each device object contains a __type discriminator identifying the concrete CARP device type.'
      tags:
        - 'Primary Devices'
      parameters:
        -
          $ref: '#/components/parameters/sessionId'
      responses:
        '200':
          description: 'Primary devices returned'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrimaryDevicesResponse'
        '400':
          description: 'Missing session id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        default:
          $ref: '#/components/responses/ServerError'
  /sessions/{sessionId}/primary-devices/smartphone:
    post:
      summary: 'Add a smartphone primary device to the session protocol'
      operationId: 'addSmartphonePrimaryDevice'
      description: 'Adds a Smartphone as the primary device in the session protocol. A primary device must be added before tasks and triggers can be added. roleName defaults to "Smartphone" if omitted. Adding a primary device fulfills the critical requirement for at least one primary device.'
      tags:
        - 'Primary Devices'
      parameters:
        -
          $ref: '#/components/parameters/sessionId'
      requestBody:
        description: 'Optional role name for the primary smartphone.'
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrimaryDeviceRoleRequest'
            example:
              roleName: 'User Phone'
      responses:
        '201':
          description: 'Primary device added'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionMutationResponse'
        '400':
          description: 'Missing session id, invalid payload, or incompatible protocol type'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        default:
          $ref: '#/components/responses/ServerError'
  /sessions/{sessionId}/primary-devices/web-browser:
    post:
      summary: 'Add a web browser primary device to the session protocol'
      operationId: 'addWebBrowserPrimaryDevice'
      description: 'Adds a WebBrowser as the primary device in the session protocol. A primary device must be added before tasks and triggers can be added. roleName defaults to "Web Browser" if omitted. Adding a primary device fulfills the critical requirement for at least one primary device.'
      tags:
        - 'Primary Devices'
      parameters:
        -
          $ref: '#/components/parameters/sessionId'
      requestBody:
        description: 'Optional role name for the primary web browser.'
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrimaryDeviceRoleRequest'
            example:
              roleName: 'Participant Browser'
      responses:
        '201':
          description: 'Primary device added'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionMutationResponse'
        '400':
          description: 'Missing session id, invalid payload, or incompatible protocol type'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        default:
          $ref: '#/components/responses/ServerError'
  /sessions/{sessionId}/participant-roles:
    get:
      summary: 'Get participant role names from the session protocol'
      operationId: 'getParticipantRoles'
      description: 'Returns participant role names currently configured in the session protocol. Returns only the role names, not full role objects.'
      tags:
        - 'Participant Roles'
      parameters:
        -
          $ref: '#/components/parameters/sessionId'
      responses:
        '200':
          description: 'Participant role names returned'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantRolesResponse'
        '400':
          description: 'Missing session id or protocol not started'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        default:
          $ref: '#/components/responses/ServerError'
    post:
      summary: 'Add a participant role to the protocol in the session'
      operationId: 'addParticipantRole'
      description: 'Adds a participant role to the session protocol. roleName must be non-empty and unique within the protocol. isOptional defaults to false if omitted, meaning the role is required to be filled for the study to run.'
      tags:
        - 'Participant Roles'
      parameters:
        -
          $ref: '#/components/parameters/sessionId'
      requestBody:
        description: 'Participant role configuration payload.'
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddParticipantRoleRequest'
            example:
              roleName: 'Patient'
              isOptional: false
      responses:
        '201':
          description: 'Participant role added'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionMutationResponse'
        '400':
          description: 'Missing or invalid request body'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        default:
          $ref: '#/components/responses/ServerError'
  /sessions/{sessionId}/participant-roles/expected-data:
    post:
      summary: 'Add expected participant data for a specific role'
      operationId: 'addExpectedParticipantDataForRole'
      description: 'Declares that a specific participant role is expected to provide the given dataType. roleName must match an existing participant role; if it does not, the session carries an unfulfilled requirement. dataType must be one of the enum values listed in ParticipantDataType.'
      tags:
        - 'Expected Participant Data'
      parameters:
        -
          $ref: '#/components/parameters/sessionId'
      requestBody:
        description: 'Expected participant data payload for a specific role.'
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddExpectedParticipantDataForRoleRequest'
            example:
              roleName: 'Patient'
              dataType: 'sex'
      responses:
        '201':
          description: 'Expected participant data added for role'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionMutationResponse'
        '400':
          description: 'Missing or invalid request body'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        default:
          $ref: '#/components/responses/ServerError'
  /sessions/{sessionId}/expected-data:
    post:
      summary: 'Add expected participant data for all roles'
      operationId: 'addExpectedParticipantDataForAllRoles'
      description: 'Declares that all participant roles are expected to provide the given dataType. dataType must be one of the enum values listed in ParticipantDataType.'
      tags:
        - 'Expected Participant Data'
      parameters:
        -
          $ref: '#/components/parameters/sessionId'
      requestBody:
        description: 'Expected participant data type payload.'
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddExpectedParticipantDataRequest'
            example:
              dataType: 'informed_consent'
      responses:
        '201':
          description: 'Expected participant data added for all roles'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionMutationResponse'
        '400':
          description: 'Missing or invalid request body'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        default:
          $ref: '#/components/responses/ServerError'
  /sessions/{sessionId}/services:
    get:
      summary: 'Get connected services from the session protocol'
      operationId: 'getServiceRoles'
      description: 'Returns connected services currently configured in the session protocol, including role name and serialized service payload. Each service object contains a __type discriminator identifying the concrete CARP service type.'
      tags:
        - 'Services'
      parameters:
        -
          $ref: '#/components/parameters/sessionId'
      responses:
        '200':
          description: 'Connected services returned'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRolesResponse'
        '400':
          description: 'Missing session id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        default:
          $ref: '#/components/responses/ServerError'
  /sessions/{sessionId}/services/weather:
    post:
      summary: 'Add weather service to the session protocol'
      operationId: 'addWeatherService'
      description: 'Adds a background weather data service to the session protocol. primaryDeviceRoleName must match an existing primary device role. roleName defaults to "Weather" if omitted. The service collects ambient weather data from an online API.'
      tags:
        - 'Services'
      parameters:
        -
          $ref: '#/components/parameters/sessionId'
      requestBody:
        description: 'Weather service configuration payload.'
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WeatherServiceRequest'
            example:
              roleName: 'Local Weather'
              primaryDeviceRoleName: 'User Phone'
      responses:
        '201':
          description: 'Weather service added'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionMutationResponse'
        '400':
          description: 'Missing or invalid request body, or primary device not configured'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        default:
          $ref: '#/components/responses/ServerError'
  /sessions/{sessionId}/services/air-quality:
    post:
      summary: 'Add air quality service to the session protocol'
      operationId: 'addAirQualityService'
      description: 'Adds a background air quality data service to the session protocol. primaryDeviceRoleName must match an existing primary device role. roleName defaults to "Air Quality" if omitted. The service collects ambient air quality readings from an online API.'
      tags:
        - 'Services'
      parameters:
        -
          $ref: '#/components/parameters/sessionId'
      requestBody:
        description: 'Air quality service configuration payload.'
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AirQualityServiceRequest'
            example:
              roleName: 'Local Air Quality'
              primaryDeviceRoleName: 'User Phone'
      responses:
        '201':
          description: 'Air quality service added'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionMutationResponse'
        '400':
          description: 'Missing or invalid request body, or primary device not configured'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        default:
          $ref: '#/components/responses/ServerError'
  /sessions/{sessionId}/services/health:
    post:
      summary: 'Add health service to the session protocol'
      operationId: 'addHealthService'
      description: 'Adds a background health data service to the session protocol. primaryDeviceRoleName must match an existing primary device role. roleName defaults to "Health" if omitted. The service reads health data from the platform health framework (Apple Health or Google Fit).'
      tags:
        - 'Services'
      parameters:
        -
          $ref: '#/components/parameters/sessionId'
      requestBody:
        description: 'Health service configuration payload.'
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HealthServiceRequest'
            example:
              roleName: 'Device Health'
              primaryDeviceRoleName: 'User Phone'
      responses:
        '201':
          description: 'Health service added'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionMutationResponse'
        '400':
          description: 'Missing or invalid request body, or primary device not configured'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        default:
          $ref: '#/components/responses/ServerError'
  /sessions/{sessionId}/services/location:
    post:
      summary: 'Add location service to the session protocol'
      operationId: 'addLocationService'
      description: 'Adds a background location service to the session protocol. primaryDeviceRoleName must match an existing primary device role. roleName defaults to "Location" if omitted. accuracy controls the GPS accuracy level; distance sets the minimum movement threshold in meters; notificationTitle and notificationMessage configure the background location notification on Android.'
      tags:
        - 'Services'
      parameters:
        -
          $ref: '#/components/parameters/sessionId'
      requestBody:
        description: 'Location service configuration payload.'
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationServiceRequest'
            example:
              roleName: 'User Location'
              primaryDeviceRoleName: 'User Phone'
              accuracy: 'balanced'
              distance: 10.0
              interval:
                seconds: 60
              notificationTitle: 'Tracking active'
              notificationMessage: 'Location tracking is running.'
              notificationDescription: 'Tap to return to the app.'
              notificationIconName: 'ic_notification'
              notificationOnTapBringToFront: false
      responses:
        '201':
          description: 'Location service added'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionMutationResponse'
        '400':
          description: 'Missing or invalid request body, or primary device not configured'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        default:
          $ref: '#/components/responses/ServerError'
  /sessions/{sessionId}/devices:
    get:
      summary: 'Get connected devices from the session protocol'
      operationId: 'getDeviceRoles'
      description: 'Returns connected devices currently configured in the session protocol, including role name and serialized device payload. Each device object contains a __type discriminator identifying the concrete CARP device type.'
      tags:
        - 'Devices'
      parameters:
        -
          $ref: '#/components/parameters/sessionId'
      responses:
        '200':
          description: 'Connected devices returned'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceRolesResponse'
        '400':
          description: 'Missing session id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        default:
          $ref: '#/components/responses/ServerError'
  /sessions/{sessionId}/devices/e-sense:
    post:
      summary: 'Add an eSense device to the session protocol'
      operationId: 'addESenseDevice'
      description: 'Adds a connected eSense hearing device to the session protocol. primaryDeviceRoleName must match an existing primary device role — if it does not, an unfulfilled critical requirement is recorded. roleName defaults to "eSense" if omitted. samplingRate sets the sensor sampling frequency in Hz.'
      tags:
        - 'Devices'
      parameters:
        -
          $ref: '#/components/parameters/sessionId'
      requestBody:
        description: 'eSense device payload.'
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ESenseDeviceRequest'
            example:
              roleName: 'Left Earbud'
              primaryDeviceRoleName: 'User Phone'
              isOptional: false
              samplingRate: 10
      responses:
        '201':
          description: 'eSense device added'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionMutationResponse'
        '400':
          description: 'Missing or invalid request body values, or primary device not configured'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        default:
          $ref: '#/components/responses/ServerError'
  /sessions/{sessionId}/devices/movesense:
    post:
      summary: 'Add a Movesense device to the session protocol'
      operationId: 'addMovesenseDevice'
      description: 'Adds a connected Movesense wearable sensor to the session protocol. primaryDeviceRoleName must match an existing primary device role — if it does not, an unfulfilled critical requirement is recorded. roleName defaults to "Movesense" if omitted.'
      tags:
        - 'Devices'
      parameters:
        -
          $ref: '#/components/parameters/sessionId'
      requestBody:
        description: 'Movesense device payload.'
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovesenseDeviceRequest'
            example:
              roleName: 'Chest Sensor'
              primaryDeviceRoleName: 'User Phone'
              isOptional: false
      responses:
        '201':
          description: 'Movesense device added'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionMutationResponse'
        '400':
          description: 'Missing or invalid request body values, or primary device not configured'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        default:
          $ref: '#/components/responses/ServerError'
  /sessions/{sessionId}/devices/movisens:
    post:
      summary: 'Add a Movisens device to the session protocol'
      operationId: 'addMovisensDevice'
      description: 'Adds a connected Movisens wearable sensor to the session protocol. primaryDeviceRoleName must match an existing primary device role — if it does not, an unfulfilled critical requirement is recorded. roleName defaults to "Movisens" if omitted. sensorLocation must be one of the enum values in the MovisensDeviceRequest schema if provided.'
      tags:
        - 'Devices'
      parameters:
        -
          $ref: '#/components/parameters/sessionId'
      requestBody:
        description: 'Movisens device payload.'
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovisensDeviceRequest'
            example:
              roleName: 'Torso Sensor'
              primaryDeviceRoleName: 'User Phone'
              sensorLocation: 'Chest'
              sex: 'Male'
              height: 178
