      required:
        - 'triggerName'
      properties:
        triggerName:
          type: 'string'
          example: 'show_demographics_once'
    PassiveTriggerRequest:
      type: 'object'
      required:
        - 'triggerName'
      properties:
        triggerName:
          type: 'string'
          example: 'manual_code_trigger'
    PeriodicTriggerRequest:
      type: 'object'
      required:
