            schema:
              $ref: '#/components/schemas/PrimaryDeviceRoleRequest'
            example:
              roleName: 'Participant Browser'
      responses:
        200:
          description: 'Primary device added'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementsResponse'
        400:
          description: 'Missing session id, invalid payload, or incompatible protocol type'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: 'Session id not found'
          content:
            application/json:
              schema:
