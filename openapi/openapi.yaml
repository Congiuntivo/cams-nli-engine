          name: 'sessionId'
          in: 'path'
          required: true
          description: 'Session id returned by POST /protocol/new.'
          schema:
            type: 'string'
            example: 'session_1234567890_1'
      responses:
        200:
          description: 'Participant role names returned'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantRolesResponse'
        400:
          description: 'Missing session id or protocol not started'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: 'Session id not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: 'Add a participant role to the protocol in the session'
      operationId: 'addParticipantRole'
      description: 'Adds a participant role. Protocol must already be started with POST /protocol/new.'
      tags:
        - 'Participant Roles'
      parameters:
        -
          name: 'sessionId'
          in: 'path'
          required: true
          description: 'Session id returned by POST /protocol/new.'
          schema:
            type: 'string'
            example: 'session_1234567890_1'
      requestBody:
        description: 'Participant role configuration payload.'
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddParticipantRoleRequest'
            example:
              roleName: 'Patient'
              isOptional: false
      responses:
        200:
          description: 'Participant role added'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEndpointResponse'
        400:
          description: 'Missing or invalid request body'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: 'Session id not found'
          content:
            application/json:
              schema:
