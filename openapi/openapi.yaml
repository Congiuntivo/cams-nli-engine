  /sessions/{sessionId}/tasks/background:
    post:
      summary: 'Add a background task to the session protocol'
      operationId: 'addBackgroundTask'
      description: 'Adds a background sensing task to the session protocol. name must be unique within the protocol. measures is a list of objects each with a measureType (CARP measure type URI) and an optional samplingConfiguration. To collect health data from Apple Health or Google Health Connect, use measureType "dk.cachet.carp.health" with samplingType "health" and a non-empty healthDataTypes array. Returns 400 if a measure type is unrecognized or its sampling configuration is incompatible.'
      tags:
        - 'Tasks'
      parameters:
        -
          $ref: '#/components/parameters/sessionId'
      requestBody:
        description: 'Background task payload.'
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackgroundTaskRequest'
            example:
              name: 'daily_context_collection'
              description: 'Collect context snapshots during the day.'
              duration:
                minutes: 30
              measures:
                -
                  measureType: 'dk.cachet.carp.activity'
                -
                  measureType: 'dk.cachet.carp.ambientlight'
                  samplingConfiguration:
                    samplingType: 'periodic'
                    interval:
                      minutes: 5
                    duration:
                      seconds: 10
                -
                  measureType: 'dk.cachet.carp.health'
                  samplingConfiguration:
                    samplingType: 'health'
                    healthDataTypes:
                      - 'STEPS'
                      - 'HEART_RATE'
                    days: 30
      responses:
        '201':
          description: 'Background task added'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionMutationResponse'
        '400':
          description: 'Invalid request payload or unsupported measure/sampling'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        default:
          $ref: '#/components/responses/ServerError'
