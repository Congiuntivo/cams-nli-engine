          $ref: '#/components/schemas/DurationRequest'
    WebTaskRequest:
      type: 'object'
      required:
        - 'name'
        - 'description'
        - 'measures'
        - 'url'
      properties:
        name:
          type: 'string'
          example: 'daily_survey'
        description:
          type: 'string'
          example: 'Open a daily web survey for participants.'
        measures:
          type: 'array'
          items:
            $ref: '#/components/schemas/TaskMeasureRequest'
        url:
          type: 'string'
          example: 'https://example.org/surveys/daily'
    AppTaskRequest:
      type: 'object'
      required:
        - 'name'
        - 'description'
        - 'measures'
        - 'type'
      properties:
        name:
          type: 'string'
          example: 'daily_survey_app_task'
        description:
          type: 'string'
          example: 'Run a survey task in the app.'
        measures:
          type: 'array'
          items:
            $ref: '#/components/schemas/TaskMeasureRequest'
        type:
          type: 'string'
          example: 'survey'
        title:
          type: 'string'
          example: 'Daily Survey'
        instructions:
          type: 'string'
          example: 'Answer the questionnaire in-app.'
        minutesToComplete:
          type: 'integer'
          example: 5
        expire:
          $ref: '#/components/schemas/DurationRequest'
        notification:
          type: 'boolean'
          example: true
    HealthAppTaskRequest:
      type: 'object'
      required:
        - 'name'
        - 'description'
        - 'measures'
        - 'types'
      properties:
        name:
          type: 'string'
          example: 'daily_health_assessment'
        description:
          type: 'string'
          example: 'Collect daily health assessment in-app.'
        measures:
          type: 'array'
          items:
            $ref: '#/components/schemas/TaskMeasureRequest'
        types:
          type: 'array'
          items:
            type: 'string'
        title:
          type: 'string'
          example: 'Health Assessment'
        instructions:
          type: 'string'
          example: 'Follow the health assessment steps.'
        minutesToComplete:
          type: 'integer'
          example: 5
        expire:
          $ref: '#/components/schemas/DurationRequest'
        notification:
          type: 'boolean'
          example: true
    TaskControlsResponse:
      type: 'object'
      required:
        - 'taskControls'
      properties:
        taskControls:
          type: 'array'
          items:
            $ref: '#/components/schemas/TaskControlSummary'
    TaskControlSummary:
      type: 'object'
      required:
        - 'taskControl'
        - 'trigger'
        - 'task'
        - 'targetDevice'
      properties:
        taskControl:
          type: 'object'
          additionalProperties: true
        trigger:
          type: 'object'
          additionalProperties: true
        task:
          type: 'object'
          additionalProperties: true
        targetDevice:
          type: 'object'
          additionalProperties: true
    TaskControlRequest:
      type: 'object'
      required:
        - 'taskName'
        - 'triggerName'
        - 'deviceRoleName'
      properties:
        taskName:
          type: 'string'
          example: 'daily_survey'
        triggerName:
          type: 'string'
          example: 'start_now'
        deviceRoleName:
          type: 'string'
          example: 'User Phone'
    TriggerSummary:
      type: 'object'
      required:
        - 'name'
        - 'trigger'
      properties:
        name:
          type: 'string'
          example: '0'
        trigger:
          type: 'object'
          additionalProperties: true
    TriggersResponse:
      type: 'object'
      required:
        - 'triggers'
      properties:
        triggers:
          type: 'array'
          items:
            $ref: '#/components/schemas/TriggerSummary'
    CronScheduledTriggerRequest:
      type: 'object'
      required:
        - 'triggerName'
      properties:
        triggerName:
          type: 'string'
          example: 'daily_evening_prompt'
        minute:
          type: 'integer'
          example: 30
        hour:
          type: 'integer'
          example: 19
        day:
          type: 'integer'
          example: 1
        month:
          type: 'integer'
          example: 1
        weekday:
          type: 'integer'
          example: 1
    DateTimeTriggerRequest:
      type: 'object'
      required:
        - 'triggerName'
        - 'schedule'
      properties:
        triggerName:
          type: 'string'
          example: 'enrollment_follow_up'
        schedule:
          type: 'string'
          example: '2026-10-01T09:30:00Z'
    DelayedTriggerRequest:
      type: 'object'
      required:
        - 'triggerName'
        - 'delay'
      properties:
        triggerName:
          type: 'string'
          example: 'delayed_prompt'
        delay:
          $ref: '#/components/schemas/DurationRequest'
    ElapsedTimeTriggerRequest:
      type: 'object'
      required:
        - 'triggerName'
        - 'elapsedTime'
      properties:
        triggerName:
          type: 'string'
          example: 'elapsed_30_minutes'
        elapsedTime:
          $ref: '#/components/schemas/DurationRequest'
    ImmediateTriggerRequest:
      type: 'object'
      required:
        - 'triggerName'
      properties:
        triggerName:
          type: 'string'
          example: 'start_now'
    ManualTriggerRequest:
      type: 'object'
      required:
        - 'triggerName'
      properties:
        triggerName:
          type: 'string'
          example: 'manual_daily_prompt'
        label:
          type: 'string'
          example: 'Daily prompt'
        description:
          type: 'string'
          example: 'Shown manually by the participant.'
    NoOpTriggerRequest:
      type: 'object'
      required:
        - 'triggerName'
      properties:
        triggerName:
          type: 'string'
          example: 'always_on'
    NoUserTaskTriggerRequest:
      type: 'object'
      required:
        - 'triggerName'
        - 'taskName'
      properties:
        triggerName:
          type: 'string'
          example: 'ensure_survey_task'
        taskName:
          type: 'string'
          example: 'daily_survey'
    OneTimeTriggerRequest:
      type: 'object'
      required:
        - 'triggerName'
      properties:
        triggerName:
          type: 'string'
          example: 'show_demographics_once'
    PassiveTriggerRequest:
      type: 'object'
      required:
        - 'triggerName'
      properties:
        triggerName:
          type: 'string'
          example: 'manual_code_trigger'
    PeriodicTriggerRequest:
      type: 'object'
      required:
        - 'triggerName'
        - 'period'
      properties:
        triggerName:
          type: 'string'
          example: 'periodic_prompt'
        period:
          $ref: '#/components/schemas/DurationRequest'
    TimeOfDayRequest:
      type: 'object'
      required:
        - 'hour'
        - 'minute'
      properties:
        hour:
          type: 'integer'
          example: 8
        minute:
          type: 'integer'
          example: 30
        second:
          type: 'integer'
          example: 0
    RandomRecurrentTriggerRequest:
      type: 'object'
      required:
        - 'triggerName'
        - 'minNumberOfTriggers'
        - 'maxNumberOfTriggers'
        - 'startTime'
        - 'endTime'
      properties:
        triggerName:
          type: 'string'
          example: 'random_daily_prompts'
        minNumberOfTriggers:
          type: 'integer'
          example: 3
        maxNumberOfTriggers:
          type: 'integer'
          example: 8
        startTime:
          $ref: '#/components/schemas/TimeOfDayRequest'
        endTime:
          $ref: '#/components/schemas/TimeOfDayRequest'
    RecurrentScheduledTriggerRequest:
      type: 'object'
      required:
        - 'triggerName'
        - 'type'
        - 'time'
      properties:
        triggerName:
          type: 'string'
          example: 'weekday_checkin'
        type:
          type: 'string'
          enum:
            - 'daily'
            - 'weekly'
            - 'monthly'
          example: 'weekly'
        time:
          $ref: '#/components/schemas/TimeOfDayRequest'
        end:
          type: 'string'
          example: '2026-12-31T23:59:59Z'
        separationCount:
          type: 'integer'
          example: 1
        maxNumberOfSampling:
          type: 'integer'
          example: 10
        dayOfWeek:
          type: 'integer'
          example: 1
        weekOfMonth:
          type: 'integer'
          example: 2
        dayOfMonth:
          type: 'integer'
          example: 15
        duration:
          $ref: '#/components/schemas/DurationRequest'
    RecurrenceEndRequest:
      type: 'object'
      required:
        - 'type'
      properties:
        type:
          type: 'string'
          enum:
            - 'until'
            - 'count'
            - 'never'
          example: 'never'
        elapsedTime:
          $ref: '#/components/schemas/DurationRequest'
        count:
          type: 'integer'
          example: 10
    RecurrenceRuleRequest:
      type: 'object'
      required:
        - 'frequency'
      properties:
        frequency:
          type: 'string'
          enum:
            - 'secondly'
            - 'minutely'
            - 'hourly'
            - 'daily'
            - 'weekly'
            - 'monthly'
            - 'yearly'
          example: 'daily'
        interval:
          type: 'integer'
          example: 1
        end:
          $ref: '#/components/schemas/RecurrenceEndRequest'
    ScheduledTriggerRequest:
      type: 'object'
      required:
        - 'triggerName'
        - 'time'
        - 'recurrenceRule'
      properties:
        triggerName:
          type: 'string'
          example: 'daily_checkin'
        time:
          $ref: '#/components/schemas/TimeOfDayRequest'
        recurrenceRule:
          $ref: '#/components/schemas/RecurrenceRuleRequest'
    UserTaskTriggerRequest:
      type: 'object'
      required:
        - 'triggerName'
        - 'taskName'
        - 'triggerCondition'
      properties:
        triggerName:
          type: 'string'
          example: 'survey_completion_trigger'
        taskName:
          type: 'string'
          example: 'daily_survey'
        triggerCondition:
          type: 'string'
          enum:
            - 'initialized'
            - 'enqueued'
            - 'dequeued'
            - 'notified'
            - 'started'
            - 'canceled'
            - 'done'
            - 'expired'
            - 'undefined'
          example: 'done'
    SamplingEventTriggerRequest:
      type: 'object'
      required:
        - 'triggerName'
        - 'measureType'
      properties:
        triggerName:
          type: 'string'
          example: 'after_completed_task'
        measureType:
          type: 'string'
          example: 'dk.cachet.carp.completed_task'
        triggerCondition:
          $ref: '#/components/schemas/SerializedCarpDataRequest'
    SerializedCarpDataRequest:
      type: 'object'
      required:
        - '__type'
      properties:
        __type:
          type: 'string'
          example: 'dk.cachet.carp.common.application.data.completedtask'