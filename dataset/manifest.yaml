      v1: "I want to set up a study with passive phone sensing (steps, location, battery, screen, ambient light, activity, device info) and connectivity monitoring (connectivity, wifi, bluetooth). Sample weather and air quality every 30 minutes. Collect health data every hour: weight, BMI, birth date, gender, steps, heart rate, HRV RMSSD and SDNN, and all sleep stages (awake, in bed, asleep, deep, light, REM). Add two persistent image app tasks that always stay on the app task list with an estimated competion time of 3 minutes — one asking the user to upload a picture of the best demo they've seen, one asking for the best gadget they received. Create both the same way. Retain data locally even after upload. Use CARP Web Service."
      v2: "I want to set up a study with passive phone sensing (steps, location, battery, screen, ambient light, activity, device info) and connectivity monitoring (connectivity, wifi, bluetooth). Sample weather and air quality every 30 minutes. Collect health data every hour: weight, BMI, birth date, gender, steps, heart rate, HRV RMSSD and SDNN, and all sleep stages (awake, in bed, asleep, deep, light, REM). Add two persistent image capture tasks in the app that always stay on the task list with an estimated competion time of 3 minutes — one asking the user to upload a picture of the best demo they've seen, one asking for the best gadget they received. Create both the same way. Retain data locally even after upload. Use CARP Web Service."
