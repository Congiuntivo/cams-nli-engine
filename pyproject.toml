[project]
name = "nli-engine"
version = "0.1.0"
description = "A natural language interface engine for authoring CAMS study protocols."
readme = "README.md"
authors = [{ name = "Congiuntivo", email = "simonedecarli19@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "python-dateutil>=2.8",
    "pyyaml>=6.0",
    "urllib3>=1.25.3,<3",
    "litellm>=1.0",
]

[project.optional-dependencies]
cli = ["rich>=13.0"]

[project.scripts]
nli-engine = "nli_engine:main"
nli-eval = "nli_engine.eval.cli:main"

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "openapi-generator-cli>=7.21.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]
