[project]
name = "nli-engine"
version = "0.1.0"
description = "A natural language interface engine for authoring CAMS study protocols."
readme = "README.md"
authors = [{ name = "Congiuntivo", email = "simonedecarli19@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.13.4,<3",
    "python-dateutil>=2.8",
    "pyyaml>=3.01",
    "urllib3>=2.0.2",
    "litellm>=1.30.1",
    "fastembed>=0.8",
    "qdrant-client>=1.9",
]

[project.optional-dependencies]
cli = ["rich>=13.0"]
gui = ["nicegui>=2.0"]

[project.scripts]
nli-engine = "nli_engine:main"
nli-engine-gui = "nli_engine.gui:run"
nli-eval = "nli_engine.eval.cli:main"

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "openapi-generator-cli>=7.22.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "ruff>=0.4.0",
]
