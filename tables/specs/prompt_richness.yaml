name: prompt_richness
source: dataset/prompt_richness.csv
csv_options:
  comment: "#"
sort_by:
  - column: case
  - column: richness
    order: [poor, medium, rich]
row_group:
  column: case
  style: merge
columns:
  - name: case
    header: Case
    type: text
  - name: richness
    header: Richness
    type: text
  - name: word_count
    header: Words
    type: numeric
    decimals: 0
  - name: markdown_elements
    header: Markdown
    type: numeric
    decimals: 0
  - name: carp_terms
    header: CARP
    type: numeric
    decimals: 0
